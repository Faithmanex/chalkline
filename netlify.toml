# Static site: no build step, everything served from the repository root.
[build]
  publish = "."
  command = ""

# Long cache for the screenshots, never for the HTML.
[[headers]]
  for = "/shots/*"
  [headers.values]
    cache-control = "public, max-age=86400"

[[headers]]
  for = "/*.html"
  [headers.values]
    cache-control = "public, max-age=0, must-revalidate"
